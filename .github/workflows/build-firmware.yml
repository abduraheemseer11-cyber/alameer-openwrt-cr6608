name: Build Alameer OpenWrt - Xiaomi CR6608

on:
  workflow_dispatch:
    inputs:
      openwrt_version:
        description: "OpenWrt 23.05.x release (e.g. 23.05.5)"
        required: true
        default: "23.05.5"
      include_heavy_packages:
        description: "Also include samba4-server + softethervpn5-client (image grows to ~21 MB)"
        type: boolean
        default: false
      max_size_mb:
        description: "Warn if sysupgrade.bin is larger than this (MB)"
        required: false
        default: "16"
      publish_release:
        description: "Publish a GitHub Release with the images"
        type: boolean
        default: true
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  OPENWRT_VERSION: ${{ github.event.inputs.openwrt_version || '23.05.5' }}
  TARGET: ramips
  SUBTARGET: mt7621
  PROFILE: xiaomi_mi-router-cr6608
  GH_TOKEN: ${{ github.token }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libncurses-dev zlib1g-dev gawk git gettext \
            libssl-dev xsltproc rsync wget unzip python3 zstd xz-utils imagemagick

      - name: Prepare branding assets
        run: bash scripts/prepare-assets.sh

      - name: Download ImageBuilder
        run: |
          BASE="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${TARGET}/${SUBTARGET}"
          FILE="openwrt-imagebuilder-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64.tar.xz"
          wget -q "$BASE/$FILE"
          tar -xJf "$FILE"
          mv "openwrt-imagebuilder-${OPENWRT_VERSION}-${TARGET}-${SUBTARGET}.Linux-x86_64" imagebuilder

      - name: Fetch Argon theme packages
        run: bash scripts/fetch-argon.sh imagebuilder/packages

      - name: Build firmware
        run: |
          PACKAGES="
            luci luci-ssl luci-theme-argon luci-app-argon-config luci-i18n-base-ar luci-compat
            openvpn-openssl luci-app-openvpn eoip xl2tpd rp-pppoe-server
            lldpd olsrd batmand mesh11sd openwisp-config
            firewall4 banip luci-app-banip mwan3 luci-app-mwan3 nft-qos qos-scripts
            watchcat luci-app-watchcat tinyproxy miniupnpd
          "
          if [ "${{ github.event.inputs.include_heavy_packages }}" = "true" ]; then
            PACKAGES="$PACKAGES samba4-server softethervpn5-client"
          fi
          cd imagebuilder
          make image PROFILE="${PROFILE}" PACKAGES="$(echo $PACKAGES | xargs)" \
               FILES="$GITHUB_WORKSPACE/files" EXTRA_IMAGE_NAME="alameer"

      - name: Size report (largest packages in the image)
        if: always()
        run: |
          ROOT=$(ls -d imagebuilder/build_dir/target-*/root-${TARGET} 2>/dev/null | head -1)
          [ -n "$ROOT" ] || exit 0
          echo "### Installed size per package (uncompressed, top 25)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for l in "$ROOT"/usr/lib/opkg/info/*.list; do
            pkg=$(basename "$l" .list)
            sz=$(sed "s#^#$ROOT#" "$l" | xargs -r -d '\n' stat -c %s 2>/dev/null | awk '{s+=$1} END{print s+0}')
            echo "$sz $pkg"
          done | sort -rn | head -25 | awk '{printf "%8.2f MB  %s\n",$1/1048576,$2}' | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Check sysupgrade size
        run: |
          MAX=${{ github.event.inputs.max_size_mb || '16' }}
          F=$(ls imagebuilder/bin/targets/${TARGET}/${SUBTARGET}/*${PROFILE}*sysupgrade.bin)
          SZ=$(stat -c %s "$F"); MB=$(awk "BEGIN{printf \"%.2f\", $SZ/1048576}")
          echo "sysupgrade.bin = ${MB} MB (limit ${MAX} MB)"
          echo "**sysupgrade.bin: ${MB} MB** (limit ${MAX} MB)" >> "$GITHUB_STEP_SUMMARY"
          if awk "BEGIN{exit !($SZ > $MAX*1048576)}"; then
            echo "::warning::sysupgrade.bin is ${MB} MB, above the ${MAX} MB limit"
          fi

      - name: Collect artifacts
        run: |
          mkdir -p out
          cd imagebuilder/bin/targets/${TARGET}/${SUBTARGET}
          cp *${PROFILE}*sysupgrade.bin *${PROFILE}*factory.bin "$GITHUB_WORKSPACE/out/" 2>/dev/null || \
            cp *${PROFILE}*.bin "$GITHUB_WORKSPACE/out/"
          cp *.manifest "$GITHUB_WORKSPACE/out/" 2>/dev/null || true
          cd "$GITHUB_WORKSPACE/out" && sha256sum * > sha256sums.txt && ls -lh

      - uses: actions/upload-artifact@v4
        with:
          name: alameer-cr6608-${{ env.OPENWRT_VERSION }}
          path: out/*

      - name: Publish release
        if: ${{ github.event_name == 'push' || github.event.inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('alameer-cr6608-{0}-{1}', env.OPENWRT_VERSION, github.run_number) }}
          name: Alameer Software CR6608 - OpenWrt ${{ env.OPENWRT_VERSION }}
          body: |
            Custom OpenWrt ${{ env.OPENWRT_VERSION }} for Xiaomi Mi Router CR6608 (ramips/mt7621).
            Boots as Dumb AP at 192.168.1.20. Use `sysupgrade.bin` for upgrades from OpenWrt, `factory.bin` for first install.
          files: out/*
